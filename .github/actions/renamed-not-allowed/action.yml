name: renamed not allowed
description: Checks that a file or a directory renamed where the allowlist does not allow it is detected.
inputs:
  kind:
    description: Either file or directory.
    required: true
runs:
  using: composite
  steps:
    - id: subject
      uses: ./
      continue-on-error: true
      with:
        arrange: ${{ inputs.kind == 'file' && 'touch /outside' || 'mkdir /outside' }}
        act: mv /outside /renamed
        allowlist: /allowed
    - name: The action failed
      shell: bash
      env:
        OUTCOME: ${{ steps.subject.outcome }}
      run: '[ "$OUTCOME" = failure ]'
