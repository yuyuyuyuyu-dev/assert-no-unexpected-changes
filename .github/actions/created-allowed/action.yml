name: created allowed
description: Checks that a file or a directory created where the allowlist allows it is ignored.
inputs:
  kind:
    description: Either file or directory.
    required: true
runs:
  using: composite
  steps:
    - id: at-an-entry
      name: A ${{ inputs.kind }} created at the path an entry names is ignored
      uses: ./
      with:
        arrange: mkdir /allowed
        act: ${{ inputs.kind == 'file' && 'touch /allowed/thing' || 'mkdir /allowed/thing' }}
        allowlist: /allowed/thing
    - id: below-a-glob
      name: A ${{ inputs.kind }} created below an entry that ends with a glob is ignored
      if: always()
      uses: ./
      with:
        arrange: mkdir /allowed
        act: ${{ inputs.kind == 'file' && 'mkdir -p /allowed/deep && touch /allowed/deep/thing' || 'mkdir -p /allowed/deep/thing' }}
        allowlist: /allowed/*
    - id: above-a-change
      name: The directories above the allowed change are ignored
      if: always()
      uses: ./
      with:
        arrange: mkdir -p /allowed/nested
        act: ${{ inputs.kind == 'file' && 'touch /allowed/nested/thing' || 'mkdir /allowed/nested/thing' }}
        allowlist: /allowed/nested/thing
