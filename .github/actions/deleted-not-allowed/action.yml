name: should detect a file or a directory deleted where the allowlist does not allow it
description: Checks that a file or a directory deleted where the allowlist does not allow it is detected.
inputs:
  kind:
    description: Either file or directory.
    required: true
runs:
  using: composite
  steps:
    - id: no-entry
      uses: ./
      continue-on-error: true
      with:
        arrange: ${{ inputs.kind == 'file' && 'touch /expected' || 'mkdir /expected' }}
        act: rm -r /expected
    - name: A ${{ inputs.kind }} deleted where no entry names it is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.no-entry.outcome }}
      run: test "$OUTCOME" = failure
    - id: below-an-entry
      if: always()
      uses: ./
      continue-on-error: true
      with:
        arrange: ${{ inputs.kind == 'file' && 'mkdir /allowed && touch /allowed/expected' || 'mkdir -p /allowed/expected' }}
        act: rm -r /allowed/expected
        allowlist: /allowed
    - name: A ${{ inputs.kind }} deleted below an entry that has no glob is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.below-an-entry.outcome }}
      run: test "$OUTCOME" = failure
