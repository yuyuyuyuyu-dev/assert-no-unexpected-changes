name: below an entry
description: Checks that an allowlist entry without a glob covers the path it names and nothing below it.
runs:
  using: composite
  steps:
    - id: subject
      uses: ./
      continue-on-error: true
      with:
        arrange: mkdir /allowed
        act: touch /allowed/thing
        allowlist: /allowed
    - name: The action failed
      shell: bash
      env:
        OUTCOME: ${{ steps.subject.outcome }}
      run: '[ "$OUTCOME" = failure ]'
