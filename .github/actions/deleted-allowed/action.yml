name: should ignore a file or a directory deleted where the allowlist allows it
description: Checks that a file or a directory deleted where the allowlist allows it is ignored.
inputs:
  kind:
    description: Either file or directory.
    required: true
runs:
  using: composite
  steps:
    - id: at-an-entry
      name: A ${{ inputs.kind }} deleted at the path an entry names is ignored
      uses: ./
      with:
        arrange: ${{ inputs.kind == 'file' && 'touch /cache' || 'mkdir /cache' }}
        act: rm -r /cache
        allowlist: /cache
    - id: below-a-glob
      name: A ${{ inputs.kind }} deleted below an entry that ends with a glob is ignored
      if: always()
      uses: ./
      with:
        arrange: ${{ inputs.kind == 'file' && 'mkdir -p /cache/deep && touch /cache/deep/foo' || 'mkdir -p /cache/deep/foo' }}
        act: rm -r /cache/deep/foo
        allowlist: /cache/*
    - id: above-a-change
      name: The directories above the allowed change are ignored
      if: always()
      uses: ./
      with:
        arrange: ${{ inputs.kind == 'file' && 'mkdir -p /allowed/nested && touch /allowed/nested/cache' || 'mkdir -p /allowed/nested/cache' }}
        act: rm -r /allowed/nested/cache
        allowlist: /allowed/nested/cache
