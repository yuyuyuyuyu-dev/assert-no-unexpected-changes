name: should detect a file or a directory created where the allowlist does not allow it
description: Checks that a file or a directory created where the allowlist does not allow it is detected.
inputs:
  kind:
    description: Either file or directory.
    required: true
runs:
  using: composite
  steps:
    - id: no-entry
      uses: ./
      continue-on-error: true
      with:
        act: ${{ inputs.kind == 'file' && 'touch /unexpected' || 'mkdir /unexpected' }}
        allowlist: /allowed
    - name: A ${{ inputs.kind }} created where no entry names it is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.no-entry.outcome }}
      run: test "$OUTCOME" = failure
    - id: below-an-entry
      if: always()
      uses: ./
      continue-on-error: true
      with:
        arrange: mkdir /allowed
        act: ${{ inputs.kind == 'file' && 'touch /allowed/unexpected' || 'mkdir /allowed/unexpected' }}
        allowlist: /allowed
    - name: A ${{ inputs.kind }} created below an entry that has no glob is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.below-an-entry.outcome }}
      run: test "$OUTCOME" = failure
