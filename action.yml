name: assert no unexpected changes
description: "Asserts that your desktop app, CLI tool or anything else makes no unexpected changes."
branding:
  icon: shield
  color: green
inputs:
  arrange:
    description: "Optional. The preparation steps, run in `sh`. Their changes are not measured."
    required: false
    default: ""
  act:
    description: "The command to be verified, run in `sh`."
    required: true
  allowlist:
    description: "Optional. The absolute paths that may change, one per line. An entry is a glob whose `*` also matches `/`, so `/for/example/cache` covers that directory alone and `/for/example/cache/*` covers everything below it. The working directory may change without being listed."
    required: false
    default: ""
  workdir:
    description: "Optional. Where the checkout is placed and where the command starts. Defaults to `/workdir`."
    required: false
    default: /workdir
  image:
    description: "Optional. The image the command runs in, which must run as root. Defaults to Ubuntu."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check the runner's operating system
      shell: bash
      run: |
        if [[ $RUNNER_OS != Linux ]]; then
          echo "::error::this action builds and runs Docker containers, which GitHub Actions supports on Linux runners only, but this job runs on $RUNNER_OS. Use a Linux runner such as ubuntu-latest."
          exit 1
        fi
    # The inputs are passed as environment variables rather than interpolated
    # into the script, so that a value containing shell syntax stays a value.
    - name: Assert that nothing unexpected changed
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_ARRANGE: ${{ inputs.arrange }}
        INPUT_ACT: ${{ inputs.act }}
        INPUT_ALLOWLIST: ${{ inputs.allowlist }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_IMAGE: ${{ inputs.image }}
      run: "$ACTION_PATH/assert.sh"
