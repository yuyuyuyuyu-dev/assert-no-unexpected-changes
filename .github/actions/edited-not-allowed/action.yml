name: should detect a file edited where the allowlist does not allow it
description: Checks that a file edited where the allowlist does not allow it is detected.
runs:
  using: composite
  steps:
    - id: no-entry
      uses: ./
      continue-on-error: true
      with:
        arrange: touch /unexpected
        act: echo edited >> /unexpected
        allowlist: /allowed
    - name: A file edited where no entry names it is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.no-entry.outcome }}
      run: test "$OUTCOME" = failure
    - id: below-an-entry
      if: always()
      uses: ./
      continue-on-error: true
      with:
        arrange: mkdir /allowed && touch /allowed/thing
        act: echo edited >> /allowed/thing
        allowlist: /allowed
    - name: A file edited below an entry that has no glob is detected
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.below-an-entry.outcome }}
      run: test "$OUTCOME" = failure
